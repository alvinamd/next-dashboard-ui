version: "3.8"

services:
  postgress:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: lamadev
      POSTGRES_PASSWORD: alvin2001
      POSTGRES_DB: TMJ
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  app:
    build: .
    container_name: nextjs_app
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL:"postgresql://lamadev:alvin2001@localhost:5432/TMJ"
    depends_on:
      - postgres

volumes:
  postgres_data: